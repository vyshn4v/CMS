name: Deploy CMS Monolith to Server

on:
  pull_request:
    types:
      - closed
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    # Trigger on merged PRs into main, direct pushes to main, or manual dispatch
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Shared Types
        run: npm run build:shared-types

      - name: Run Tests
        run: npm run test

      - name: Build Monorepo (Shared Types, Web Studio, API)
        run: npm run build

      - name: Generate Production .env File
        run: |
          if [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "Generating .env from GitHub ENV_FILE secret..."
            cat << 'EOF' > .env
          ${{ secrets.ENV_FILE }}
          EOF
          else
            echo "Generating .env from individual secrets..."
            cat << EOF > .env
          NODE_ENV=production
          PORT=${{ secrets.PORT || 5000 }}
          CLIENT_URL=${{ secrets.CLIENT_URL || 'http://localhost:5000' }}
          STATIC_PATH=apps/web/dist
          DATABASE_URL="${{ secrets.DATABASE_URL }}"
          REDIS_URL="${{ secrets.REDIS_URL || 'redis://localhost:6379' }}"
          JWT_SECRET="${{ secrets.JWT_SECRET }}"
          JWT_EXPIRY="${{ secrets.JWT_EXPIRY || '24h' }}"
          GOOGLE_CLIENT_ID="${{ secrets.GOOGLE_CLIENT_ID }}"
          GOOGLE_CLIENT_SECRET="${{ secrets.GOOGLE_CLIENT_SECRET }}"
          GOOGLE_CALLBACK_URL="${{ secrets.GOOGLE_CALLBACK_URL || 'http://localhost:5000/api/v1/auth/google/callback' }}"
          ALLOWED_EMAILS="${{ secrets.ALLOWED_EMAILS }}"
          SMTP_HOST="${{ secrets.SMTP_HOST }}"
          SMTP_PORT="${{ secrets.SMTP_PORT || 587 }}"
          SMTP_USER="${{ secrets.SMTP_USER }}"
          SMTP_PASS="${{ secrets.SMTP_PASS }}"
          SMTP_SECURE="${{ secrets.SMTP_SECURE || 'false' }}"
          SMTP_FROM="${{ secrets.SMTP_FROM || 'CMS Notifications <noreply@cms.local>' }}"
          DEFAULT_EMAIL_RECIPIENT="${{ secrets.DEFAULT_EMAIL_RECIPIENT }}"
          EOF
          fi
          chmod 600 .env

      - name: Prepare Deployment Bundle
        run: |
          mkdir -p bundle
          tar -czf bundle/deploy.tar.gz \
            .env \
            package.json \
            package-lock.json \
            ecosystem.config.js \
            prisma \
            libs/shared-types/package.json \
            libs/shared-types/dist \
            apps/api/package.json \
            apps/api/dist \
            apps/web/package.json \
            apps/web/dist
          rm -f .env

      - name: Check Deployment Credentials
        id: check-credentials
        run: |
          if [ -z "${{ secrets.SSH_PRIVATE_KEY }}" ] || [ -z "${{ secrets.SERVER_HOST }}" ]; then
            echo "::warning::SERVER_HOST or SSH_PRIVATE_KEY is not configured in repository secrets. Skipping server deployment."
            echo "deployable=false" >> $GITHUB_OUTPUT
          else
            echo "Deployment credentials detected. Proceeding with deployment."
            echo "deployable=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup SSH Key
        if: steps.check-credentials.outputs.deployable == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.SERVER_PORT || 22 }} -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Bundle to Server
        if: steps.check-credentials.outputs.deployable == 'true'
        run: |
          SERVER_PATH="${{ secrets.SERVER_PATH || '/home/ubuntu/cms-backend' }}"
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "mkdir -p $SERVER_PATH"
          scp -i ~/.ssh/id_rsa -P ${{ secrets.SERVER_PORT || 22 }} bundle/deploy.tar.gz ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:$SERVER_PATH/

      - name: Extract, Migrate & Restart PM2
        if: steps.check-credentials.outputs.deployable == 'true'
        run: |
          SERVER_PATH="${{ secrets.SERVER_PATH || '/home/ubuntu/cms-backend' }}"
          APP_NAME="${{ secrets.BACKEND_APP_NAME || 'cms-api' }}"
          
          ssh -i ~/.ssh/id_rsa -p ${{ secrets.SERVER_PORT || 22 }} ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} "
            # Setup environment paths (support NVM and standard system binaries)
            export NVM_DIR=\"\$HOME/.nvm\"
            [ -s \"\$NVM_DIR/nvm.sh\" ] && \. \"\$NVM_DIR/nvm.sh\"
            export PATH=\"\$PATH:\$HOME/.nvm/versions/node/\$(ls \$HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:/usr/local/bin:/usr/bin\"

            cd $SERVER_PATH

            # Extract deployment bundle
            tar -xzf deploy.tar.gz
            rm -f deploy.tar.gz
            [ -f .env ] && chmod 600 .env

            # Install production dependencies
            npm ci --omit=dev --no-audit --no-fund

            # Generate Prisma Client & apply database migrations
            npx prisma generate
            npx prisma migrate deploy

            # Reload or start PM2 process
            if pm2 describe $APP_NAME > /dev/null 2>&1; then
              pm2 restart $APP_NAME --update-env
            else
              pm2 start ecosystem.config.js --name $APP_NAME
            fi
            pm2 save
          "
