# ==============================================================================
# Nginx Reverse Proxy Configuration for Headless CMS Monolith
# Proxies public HTTP/HTTPS traffic to the NestJS + React SPA monolith on :5000
# Target server path: /etc/nginx/sites-available/cms (symlinked to sites-enabled)
# ==============================================================================

# Upstream NestJS backend process (PM2 or Docker running on localhost:5000)
upstream cms_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# ==============================================================================
# HTTP Server: Initial Setup & Let's Encrypt Verification
# ==============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _; # Catch-all: works immediately with server IP or any domain (replace with your domain if desired)

    # Let's Encrypt ACME webroot challenge for Certbot automated SSL issuance
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Gzip compression for static assets and API responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/x-javascript
        application/xml
        image/svg+xml;

    # Main reverse proxy location for the CMS Monolith (API + SPA)
    location / {
        proxy_pass http://cms_backend;
        proxy_http_version 1.1;

        # WebSocket and persistent connection support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forwarded client and host identity headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Request payload and upload limits (supports image uploads and template JSON)
        client_max_body_size 25M;
        client_body_buffer_size 128k;

        # Timeouts aligned with heavy template compilation & email dispatches
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer configuration for high throughput on 1GB VPS
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 16 8k;
        proxy_busy_buffers_size 16k;
    }
}

